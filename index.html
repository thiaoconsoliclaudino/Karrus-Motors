<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bavaresco Car Care</title>
<meta name="theme-color" content="#141518">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#15171b;--navy2:#2a2d33;--or:#d71920;--or2:#fdeaea;--red3:#a80f15;--steel:#c4c9d0;--bg:#eceef1;--card:#fff;--line:#dfe2e7;--mut:#666d77;--ink:#16181c;--carbon:#141518;--disp:'Exo 2',Inter,sans-serif;--green:#1e9a57;--gr2:#e5f6ec;--yel:#c98a12;--ye2:#fdf4dc;--red:#d24343;--re2:#fde8e8;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.carbon{background-color:var(--carbon);background-image:linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.045) 75%),linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.045) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.checker{height:8px;background:repeating-conic-gradient(#16181c 0 25%,#fff 0 50%) 0 0/8px 8px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .w1{font-family:var(--disp);font-weight:800;font-style:italic;font-size:19px;letter-spacing:1.5px;text-transform:uppercase}
.brand .w2{font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:4.5px;color:var(--or);text-transform:uppercase;margin-top:3px}
.disp{font-family:var(--disp)}

button{cursor:pointer}
a{color:var(--navy2)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
.top{position:sticky;top:0;z-index:30;background-color:var(--carbon);background-image:linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.045) 75%),linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.045) 75%);background-size:8px 8px;background-position:0 0,4px 4px;border-bottom:3px solid var(--or);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
.logo .mk{width:32px;height:32px;border-radius:9px;background:var(--or);display:grid;place-items:center;font-weight:800;color:#fff}
.modes{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px;margin-left:auto}
.modes button{background:none;border:0;color:#cdd6e4;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px}
.modes button.on{background:var(--or);color:#fff}
.sync{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#dfe6f0;white-space:nowrap}
.sync.ok{background:rgba(30,154,87,.25);color:#c9f2da}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.p{background:linear-gradient(180deg,#e8262d,var(--red3));border-color:var(--red3);color:#fff;box-shadow:0 2px 6px rgba(215,25,32,.25)}
.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.d{color:var(--red);border-color:#f2c4c4}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#3b4656}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:15px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto}
input.bad{border-color:var(--red);background:#fff7f7}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:#eef1f5;color:#455064;white-space:nowrap}
.chip.or{background:var(--or2);color:#b3141a}.chip.gr{background:var(--gr2);color:#16733f}.chip.ye{background:var(--ye2);color:#8a5d06}.chip.re{background:var(--re2);color:#a82f2f}.chip.nv{background:#e3e9f3;color:var(--navy2)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.pills button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:14px;border:1px dashed var(--line);border-radius:12px;background:#fafbfc}
/* ---------- client phone ---------- */
.phoneWrap{display:flex;justify-content:center;padding:22px 12px 40px}
.phone{width:100%;max-width:420px;background:#fff;border-radius:28px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(19,36,63,.12);overflow:hidden;display:flex;flex-direction:column;min-height:720px}
.ph-h{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f2f5}
.ph-h .back{border:0;background:#f1f3f6;width:34px;height:34px;border-radius:10px;font-size:18px}
.ph-b{flex:1;padding:16px 18px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.ph-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff}
.ph-nav button{border:0;background:none;padding:9px 2px 11px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.ph-nav button .i{font-size:19px}
.ph-nav button.on{color:var(--or)}
.need{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.need button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:6px;min-height:86px}
.need button .i{font-size:22px}
.need button:hover{border-color:var(--or)}
.li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
button.li:hover{border-color:var(--or)}
.li .ic{width:38px;height:38px;border-radius:10px;background:var(--or2);display:grid;place-items:center;font-size:18px;flex:none}
.li .tx{flex:1;min-width:0}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dates button{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;min-width:56px;text-align:center;font-weight:700}
.dates button small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.dates button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.dates button.on small{color:#c8d2e2}
.dates button:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-weight:700}
.slots button.on{background:var(--or);border-color:var(--or);color:#fff}
.tl{display:flex;flex-direction:column;gap:0;margin:4px 0}
.tl .st{display:flex;gap:10px;align-items:flex-start;padding-bottom:14px;position:relative}
.tl .st:not(:last-child)::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;font-size:11px;color:#fff;z-index:1}
.tl .st.done .dot{background:var(--green);border-color:var(--green)}
.tl .st.cur .dot{background:var(--or);border-color:var(--or)}
.tl .st.done:not(:last-child)::after{background:var(--green)}
.hero{background-color:var(--carbon);background-image:linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.05) 75%),linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.05) 75%);background-size:8px 8px;background-position:0 0,4px 4px;color:#fff;border-radius:16px;padding:18px;border-left:4px solid var(--or)}
.big{font-size:26px;font-weight:800;font-family:var(--disp)}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px}
.opt.rec{border:2px solid var(--green);background:#f6fcf8}
/* ---------- admin ---------- */
.adm{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}
.side{background-color:#1a1c20;background-image:linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%),linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%);background-size:8px 8px;background-position:0 0,4px 4px;border-right:1px solid #000;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;color:#c9ced6;text-align:left}
.side button .i{width:20px;text-align:center}
.side button.on{background:var(--or);color:#fff}.side button:hover:not(.on){background:rgba(255,255,255,.06)}.side button.on .badge{background:#fff;color:var(--or)}
.side .badge{margin-left:auto;background:var(--or);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.side .who{margin-top:auto;padding:12px;border-top:1px solid #33363c;font-size:13px;color:#9aa1ab}
.main{padding:22px 26px 60px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{margin:0;font-size:24px;font-family:var(--disp);font-weight:800;font-style:italic;letter-spacing:.3px}
.ph .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi{background:linear-gradient(180deg,#fff,#f3f4f6);border:1px solid var(--line);border-top:3px solid var(--or);border-radius:var(--r);padding:14px 16px;position:relative}
.kpi .l{font-size:13px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:var(--disp)}
.kpi .gauge{position:absolute;right:10px;top:10px}
.kpi .s{font-size:12px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #eff1f4;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafbfd}
.kan{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto}
.kcol{background:#eef1f5;border-radius:14px;padding:10px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.kcol h4{display:flex;justify-content:space-between;font-size:13px;margin:2px 4px 4px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kcard:hover{border-color:var(--or)}
.wk{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.wk>div{border-right:1px solid #eef0f3;border-bottom:1px solid #eef0f3;padding:6px;min-height:52px;font-size:12px}
.wk .hd{background:#f7f8fa;font-weight:700;text-align:center;min-height:auto;padding:8px 4px}
.wk .hr{background:#f7f8fa;color:var(--mut);font-weight:600;text-align:right;padding-right:8px}
.ev{display:block;width:100%;border:0;border-radius:8px;padding:5px 6px;margin-bottom:3px;text-align:left;font-size:12px;font-weight:600;background:var(--navy);color:#fff;cursor:pointer}
.ev.novo{background:var(--or)}.ev.done{background:#8a97aa}
.free{color:#9aa5b5;font-size:11px}
.drawer-bg{position:fixed;inset:0;background:rgba(15,25,40,.35);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);background:#fff;height:100%;overflow:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:14px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.4);z-index:60;display:grid;place-items:center;padding:16px}
.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.x{margin-left:auto;border:0;background:#f1f3f6;width:34px;height:34px;border-radius:10px;font-size:18px}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk label{display:flex;gap:8px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.chk label.on{background:var(--gr2);border-color:#bfe6cf}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sem{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.sem i{width:10px;height:10px;border-radius:50%;display:inline-block}

.cal{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.cal-side{display:flex;flex-direction:column;gap:10px}
.cal-main{padding:0;overflow:hidden}
.cal-tb{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-title{font-family:var(--disp);font-weight:800;font-style:italic;font-size:19px;margin:0 6px}
.cal-views{margin-left:auto;flex-wrap:wrap}.cal-views button{padding:6px 10px;font-size:13px}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:6px;text-align:center}
.mc-h{font-size:11px;color:var(--mut);font-weight:700;padding:3px 0}
.mc-d{border:0;background:none;font-size:12px;padding:5px 0;border-radius:50%;position:relative;font-weight:500;aspect-ratio:1;min-width:0}
.mc-d:hover{background:#eef0f3}.mc-d.o{color:#b3b8c0}.mc-d.r{background:var(--or2);border-radius:4px}
.mc-d.t{background:var(--or);color:#fff;font-weight:800;border-radius:50%}
.mc-d.e::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--or)}
.mc-d.t.e::after{background:#fff}.mc-d.h{color:#1e9a57;font-weight:800}
.bar{height:7px;background:#eef0f3;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or);border-radius:5px}.bar.thin{height:4px;margin-top:3px}
.tg-scroll{overflow:auto;height:calc(100vh - 230px);min-height:460px;position:relative}
.tg-sticky{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line)}
.tg-head,.tg-ad,.tg-body{display:grid}
.tg-dh{text-align:center;padding:6px 0 4px;cursor:pointer;border-left:1px solid #f0f1f4}
.tg-dh .dn{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}
.tg-dh .dd{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:700;font-family:var(--disp)}
.tg-dh.t .dn{color:var(--or)}.tg-dh.t .dd{background:var(--or);color:#fff}
.tg-wn{font-size:11px;color:var(--mut);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.tg-adl{font-size:10px;color:var(--mut);text-align:right;padding:6px 6px 0 0}
.tg-adc{min-height:30px;border-left:1px solid #f0f1f4;padding:2px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.tg-body{position:relative}
.tg-hours{position:relative}
.tg-hl{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mut)}
.tg-col{position:relative;border-left:1px solid #eceef1;background-image:linear-gradient(#e7e9ed 1px,transparent 1px),linear-gradient(#f4f5f7 1px,transparent 1px);background-size:100% 48px,100% 24px;cursor:pointer}
.tg-col.t{background-color:#fffafa}
.tg-off{position:absolute;left:0;right:0;background:rgba(22,24,28,.035);pointer-events:none}
.tg-now{position:absolute;left:0;right:0;height:2px;background:var(--or);z-index:3;pointer-events:none}
.tg-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--or)}
.evb{position:absolute;z-index:2;border-radius:6px;padding:2px 6px;font-size:12px;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,#fff);border-left:3px solid var(--c);color:#16181c;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.25}
.evb:hover{box-shadow:0 3px 10px rgba(0,0,0,.15);z-index:4}
.evb .evt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evb .evs{font-size:11px;color:#4a4f57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evb .rec{position:absolute;right:5px;top:2px;font-size:11px;color:#4a4f57}
.evb .rsz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.evb.pend,.evc.pend{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#fff) 0 6px,#fff 6px 12px);border:1px dashed var(--c);border-left:3px solid var(--c)}
.evb.done,.evc.done{opacity:.6}.evb.done .evt,.evc.done{text-decoration:line-through}
.evb.k-bk .evt::before{content:"🔧 ";font-size:10px}
.evc{font-size:12px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:color-mix(in srgb,var(--c) 14%,#fff);border-left:3px solid var(--c)}
.evc.ad{background:var(--c);color:#fff;border-left:0}.evc.k-hol.cli{background:#f1ebfb;color:#5a32a8;border-left-color:#7c4dcc}
.evc.k-hol{background:#e8f6ee;color:#16733f;border-left:3px solid #1e9a57}
.evc:hover{filter:brightness(.97);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.dragging{opacity:.85;box-shadow:0 8px 22px rgba(0,0,0,.25)!important;z-index:20!important}
.drop{outline:2px dashed var(--or);outline-offset:-2px;background:var(--or2)!important}
.mv{display:flex;flex-direction:column}
.mv-h{display:grid;border-bottom:1px solid var(--line)}.mv-h>div{padding:8px;font-size:12px;font-weight:700;color:var(--mut)}
.mv-row{display:grid;min-height:118px;border-bottom:1px solid #eceef1}
.mv-wn{font-size:11px;color:var(--mut);padding:8px 4px;text-align:center;background:#fafbfc}
.mv-c{border-left:1px solid #eceef1;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.mv-c.o{background:#fafbfc}.mv-c.o .mv-d{color:#b3b8c0}
.mv-d{font-size:13px;font-weight:600;margin-bottom:2px}.mv-d span{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:13px}
.mv-d span:hover{background:#eef0f3}.mv-c.t .mv-d span{background:var(--or);color:#fff;font-weight:800}
.mv-more{font-size:12px;font-weight:700;color:var(--mut);padding:1px 6px;border-radius:5px}.mv-more:hover{background:#eef0f3}
.yv{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:16px}
.yv-t{cursor:pointer;font-family:var(--disp);font-style:italic}.yv-t:hover{color:var(--or)}
.lv{padding:6px 0}
.lv-d{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid #eceef1;padding:8px 14px}
.lv-dl{display:flex;align-items:center;gap:8px;cursor:pointer}.lv-dl .dd{font-size:22px;font-weight:800;font-family:var(--disp);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}

function brandHTML(size, light) {

function gaugeSVG(frac, size, opts) {
  opts = opts || {}; const cx = 100, cy = 100, r = 84, a0 = 135, span = 270; let t = '';
  const n = opts.mini ? 20 : 40;
  for (let i = 0; i <= n; i++) {
    const a = (a0 + span * i / n) * Math.PI / 180; const big = i % (opts.mini ? 5 : 5) === 0; const r1 = r - (big ? 13 : 6); const red = i / n >= .85;
    t += `<line x1="${(cx + r * Math.cos(a)).toFixed(1)}" y1="${(cy + r * Math.sin(a)).toFixed(1)}" x2="${(cx + r1 * Math.cos(a)).toFixed(1)}" y2="${(cy + r1 * Math.sin(a)).toFixed(1)}" stroke="${red ? '#e3262e' : '#c9ced6'}" stroke-width="${big ? 3 : 1.4}"/>`;
    if (big && !opts.mini) { const rl = r - 27; t += `<text x="${(cx + rl * Math.cos(a)).toFixed(1)}" y="${(cy + rl * Math.sin(a) + 4).toFixed(1)}" font-size="11" fill="#c9ced6" text-anchor="middle" font-family="Exo 2,Inter" font-weight="700" font-style="italic">${i / n * 160}</text>`; }
  }
  const f = Math.max(0, Math.min(1, frac)); const an = (a0 + span * f) * Math.PI / 180;
  const arc = (rr) => { const s1 = a0 * Math.PI / 180, e1 = an; const x1 = cx + rr * Math.cos(s1), y1 = cy + rr * Math.sin(s1), x2 = cx + rr * Math.cos(e1), y2 = cy + rr * Math.sin(e1); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${rr} ${rr} 0 ${span * f > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200" class="gauge"><defs><linearGradient id="gs${++_gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#8f969f"/><stop offset="1" stop-color="#e3e6ea"/></linearGradient></defs>
  <circle cx="100" cy="100" r="98" fill="url(#gs${_gid})"/><circle cx="100" cy="100" r="93" fill="#101114"/>
  ${f > 0 ? `<path d="${arc(r + 4)}" fill="none" stroke="#d71920" stroke-width="3" stroke-linecap="round" opacity=".85"/>` : ''}${t}
  <line x1="${cx - 14 * Math.cos(an)}" y1="${cy - 14 * Math.sin(an)}" x2="${(cx + (r - 10) * Math.cos(an)).toFixed(1)}" y2="${(cy + (r - 10) * Math.sin(an)).toFixed(1)}" stroke="#ff2a31" stroke-width="${opts.mini ? 6 : 4}" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="${opts.mini ? 16 : 30}" fill="#17191d" stroke="#d71920" stroke-width="2"/>
  ${opts.center ? `<text x="100" y="112" text-anchor="middle" font-family="Exo 2,Inter" font-weight="800" font-style="italic" font-size="${opts.mini ? 0 : 34}" fill="#e3262e">${esc(opts.center)}</text>` : ''}
  ${opts.sub ? `<text x="100" y="177" text-anchor="middle" font-family="Exo 2,Inter" font-weight="700" font-size="11" letter-spacing="3" fill="#d71920">${esc(opts.sub)}</text>` : ''}</svg>`;
}

}

  },

function readSolForm(id) {
  const s = clone(S.solutions.find(x => x.id === id));
  if ($('#slValor')) s.valor = numv('slValor');
  if ($('#slEntrada')) s.entrada = numv('slEntrada');
  if ($('#slMotivo')) s.motivo = val('slMotivo');
  s.opcoes = (s.opcoes || []).map(o => { if (!$('#op_n_' + o.id)) return o; const tipo = val('op_t_' + o.id); const v = val('op_v_' + o.id); return Object.assign({}, o, {nome: val('op_n_' + o.id), tipo, taxa: val('op_x_' + o.id), prazo: val('op_p_' + o.id), base: tipo === 'seg' ? '' : v, valor: tipo === 'seg' ? v : ''}); });
  return s;
}
function readSvcTable() {
  const sv = clone(C.servicos);
  for (const k of Object.keys(sv)) { if (!$('#sv_n_' + k)) continue; sv[k].nome = val('sv_n_' + k) || sv[k].nome; sv[k].preco = numv('sv_p_' + k); sv[k].dur = numv('sv_d_' + k) || sv[k].dur; }
  if ($('#rb_ki')) { sv.reboque.kmIncl = numv('rb_ki'); sv.reboque.kmExtra = numv('rb_ke'); }
  return sv;
}
function saveNbForm() { const t = U.t; if ($('#nbCid')) { t.nbCid = val('nbCid'); t.nbDist = val('nbCid_d'); } if ($('#nbUf')) t.nbUf = val('nbUf'); if ($('#nbUn')) t.nbUn = val('nbUn'); if ($('#nbHora')) t.nbHora = val('nbHora'); if ($('#nbO')) t.nbO = val('nbO'); [['nbN', 'nbN'], ['nbT', 'nbT'], ['nbE', 'nbE'], ['nbB', 'nbB'], ['nbC', 'nbC'], ['nbObs', 'nbObs']].forEach(([id, k]) => { if ($('#' + id)) t[k] = val(id); }); if ($('#nbS')) t.nbSvc = val('nbS'); if ($('#nbD')) t.nbDate = val('nbD'); }

function clearDemo() { for (const c of COLLS.concat(['personal'])) for (const o of S[c].filter(x => x.demo)) del(c, o.id); toast('Dados de exemplo apagados.'); }

/* ===================== event wiring ===================== */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.self && ev.target !== el) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'radio' && el.type !== 'checkbox')) return;
  if (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'radio')) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') return;
  ev.preventDefault(); fn(el, el.dataset, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.tagName === 'INPUT' && (FMT_BY_ID[el.id] || (el.dataset && el.dataset.fmt))) applyFmt(el); if (!el.dataset || !el.dataset.a) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, el.dataset, ev);
  else if (el.dataset.a === 'rsDate') { U.t.rsDate = el.value; render(); }
});
A.rsDate = (el) => { U.t.rsDate = el.value; render(); };
let liveT;
document.addEventListener('input', ev => {
  const el = ev.target; const lv = el.dataset && el.dataset.live; if (!lv) return;
  clearTimeout(liveT); liveT = setTimeout(() => {
    const pos = el.selectionStart, id = el.id;
    if (lv === 'fin') { U.t.valor = val('fiValor'); U.t.entrada = val('fiEntrada'); }
    if (lv === 'cons') U.t.valor = val('coValor');
    if (lv === 'reb') U.t.km = val('rbKm');
    if (lv === 'calq') U.cal.q = val('calQ');
    render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
  }, 350);
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['site', 'cliente', 'painel'].includes(h) && h !== U.mode) { U.mode = h; render(); } });
